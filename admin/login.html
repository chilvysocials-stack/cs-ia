<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sathi Café Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="login-page">
    <main class="login">
      <h1 class="login-title">Sathi Café Admin Panel</h1>

      <form class="login-form" id="login-form" novalidate>
        <label class="login-label" for="username">Username</label>
        <input class="login-input" id="username" name="username" type="text" autocomplete="username" required />

        <label class="login-label" for="password">Password</label>
        <input class="login-input" id="password" name="password" type="password" autocomplete="current-password" required />

        <p class="login-error" id="login-error" role="alert" hidden></p>

        <button class="login-button" type="submit">Login</button>
      </form>

      <p class="login-hint">Demo login: <strong>admin</strong> / <strong>sathi123</strong></p>
      <a class="login-back" href="../index.html">← Back to menu</a>
    </main>

    <script src="../js/login.js"></script>
  </body>
</html>
