<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sathi Café Menu Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-page" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">SC</span>
        <div>
          <p class="sidebar-name">Sathi Café</p>
          <p class="sidebar-role">ADMIN</p>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="Admin">
        <p class="sidebar-heading">MANAGE</p>
        <a class="sidebar-link is-active" href="index.html" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 3v7a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2V3M6.5 3v18M18 21V3c-2.2 0-4 2.2-4 6v4h4" />
          </svg>
          Menu
        </a>
        <a class="sidebar-link" href="../index.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
          </svg>
          View customer menu
        </a>
      </nav>

      <div class="sidebar-user">
        <span class="sidebar-avatar" id="admin-avatar">X</span>
        <div class="sidebar-user-text">
          <p class="sidebar-user-name" id="admin-name">Admin name</p>
          <p class="sidebar-user-role">Owner · Admin</p>
        </div>
        <button class="sidebar-logout" id="logout" type="button" aria-label="Log out" title="Log out">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4" />
          </svg>
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-header">
        <h1 class="admin-title">Menu Management System</h1>
        <button class="btn btn-light" id="undo" type="button" disabled>↶ Undo</button>
        <button class="btn btn-light" id="export-csv" type="button">Export CSV</button>
        <label class="btn btn-light">
          Import CSV
          <input class="visually-hidden" id="import-csv" type="file" accept=".csv,text/csv" />
        </label>
        <button class="btn btn-accent" id="add-item" type="button">+&nbsp;&nbsp;Add Item</button>
      </header>

      <div class="admin-content">
        <div class="toolbar">
          <nav class="chips admin-chips" id="admin-chips" aria-label="Filter by category"></nav>
          <div class="admin-search">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <label class="visually-hidden" for="admin-search-input">Search menu items</label>
            <input id="admin-search-input" type="search" placeholder="Search menu items" autocomplete="off" />
          </div>
        </div>

        <div class="workspace">
          <section class="panel table-panel" aria-label="Menu items">
            <div class="table-wrap">
              <table class="items-table">
                <thead>
                  <tr>
                    <th class="col-icon"><span class="visually-hidden">Icon</span></th>
                    <th class="col-item"><button class="sort-btn" data-sort="name">ITEM</button></th>
                    <th class="col-category"><button class="sort-btn" data-sort="category">CATEGORY</button></th>
                    <th class="col-price"><button class="sort-btn" data-sort="price">PRICE</button></th>
                    <th class="col-stock"><button class="sort-btn" data-sort="inStock">STOCK</button></th>
                    <th class="col-active"><button class="sort-btn" data-sort="active">ACTIVE</button></th>
                    <th class="col-edit"><span class="visually-hidden">Edit</span></th>
                  </tr>
                </thead>
                <tbody id="items-body"></tbody>
              </table>
              <p class="table-empty" id="table-empty" hidden>No items match this filter.</p>
            </div>
          </section>

          <section class="panel editor" id="editor" aria-labelledby="editor-title">
            <div class="editor-empty" id="editor-empty" hidden>
              <p>Select an item to edit it, or add a new one.</p>
            </div>

            <form class="editor-form" id="editor-form" novalidate>
              <div class="editor-top">
                <button class="btn btn-danger" id="delete-item" type="button">-&nbsp;Delete item</button>
              </div>
              <p class="eyebrow" id="editor-mode">EDITING</p>
              <h2 class="editor-title" id="editor-title">Item</h2>

              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" name="name" type="text" required maxlength="60" />
                <p class="field-error" data-error-for="name"></p>
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="f-price">Price (Rs.)</label>
                  <input id="f-price" name="price" type="number" inputmode="numeric" min="1" step="1" required />
                  <p class="field-error" data-error-for="price"></p>
                </div>
                <div class="field">
                  <label for="f-category">Category</label>
                  <select id="f-category" name="category"></select>
                </div>
              </div>

              <div class="field">
                <label for="f-description">Description</label>
                <textarea id="f-description" name="description" rows="2" maxlength="160"></textarea>
              </div>

              <div class="field-row">
                <div class="field">
                  <label for="f-type">Type</label>
                  <select id="f-type" name="type">
                    <option value="veg">Veg</option>
                    <option value="nonveg">Non-veg</option>
                  </select>
                </div>
                <div class="field">
                  <label for="f-stock">Stock</label>
                  <select id="f-stock" name="stock">
                    <option value="in">In stock</option>
                    <option value="out">Out of stock</option>
                  </select>
                </div>
              </div>

              <label class="checkbox">
                <input id="f-active" name="active" type="checkbox" />
                <span class="checkbox-box" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m5 12.5 4.5 4.5L19 7.5" />
                  </svg>
                </span>
                Available on menu
              </label>

              <div class="editor-actions">
                <button class="btn btn-outline" id="cancel-edit" type="button">Cancel</button>
                <button class="btn btn-primary" type="submit">Save Changes</button>
              </div>
              <p class="editor-status" id="editor-status" role="status"></p>
            </form>
          </section>
        </div>
      </div>
    </div>

    <dialog class="modal" id="delete-dialog" aria-labelledby="delete-title">
      <form method="dialog" class="modal-body">
        <span class="modal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3" />
          </svg>
        </span>
        <h2 class="modal-title" id="delete-title">Delete item?</h2>
        <p class="modal-text">Are you sure you want to delete this item? This action cannot be undone.</p>
        <p class="modal-item" id="delete-summary"></p>
        <div class="modal-actions">
          <button class="btn btn-outline btn-lg" value="cancel" type="submit">Cancel</button>
          <button class="btn btn-danger-strong btn-lg" value="confirm" type="submit" id="confirm-delete">Delete item</button>
        </div>
      </form>
    </dialog>

    <script src="../js/store.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
