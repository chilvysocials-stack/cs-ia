<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sathi Café menu</title>
    <meta name="description" content="Browse the Sathi Café menu — drinks, breakfast, momo & noodles, mains and Sathi specials." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body class="menu-page">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title">Sathi Café menu</h1>
        <p class="brand-sub brand-sub--desktop">Crafted by Chef Rajesh · Sourced from Himalayan farms</p>
        <p class="brand-sub brand-sub--mobile">Bhanimandal, Kathmandu</p>
      </div>

      <div class="search" id="search">
        <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <label class="visually-hidden" for="search-input">Search the menu</label>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search dishes, ingredients..." />
        <button class="search-close" id="search-close" type="button" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>

      <button class="search-toggle" id="search-toggle" type="button" aria-label="Search the menu">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
      </button>

      <a class="settings-link" href="admin/index.html" aria-label="Admin panel">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
          />
        </svg>
      </a>
    </header>

    <main class="page">
      <nav class="chips" id="chips" aria-label="Menu categories"></nav>

      <div class="layout">
        <aside class="subnav" id="subnav" aria-label="Filter within category">
          <ul class="subnav-list" id="subnav-list"></ul>
        </aside>

        <section class="results" aria-live="polite">
          <h2 class="results-title">
            <span class="results-title--desktop" id="title-desktop"></span>
            <span class="results-title--mobile" id="title-mobile"></span>
          </h2>
          <div class="card-grid" id="card-grid"></div>
          <p class="empty" id="empty" hidden>Nothing matches that search. Try another dish or ingredient.</p>
        </section>
      </div>
    </main>

    <template id="card-template">
      <article class="card">
        <h3 class="card-title"></h3>
        <p class="card-desc"></p>
        <div class="card-footer">
          <p class="card-price"></p>
          <span class="card-stock">Out of stock</span>
          <span class="food-mark" role="img"></span>
        </div>
      </article>
    </template>

    <script src="js/store.js"></script>
    <script src="js/menu.js"></script>
  </body>
</html>
